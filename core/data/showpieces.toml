# Naked-eye and binocular showpieces. Positions (J2000) from SIMBAD; magnitudes and
# apparent sizes from the Wikipedia infoboxes (SIMBAD where Wikipedia gives none).
# For doubles, size is the separation of the pair in arcminutes. Mira's magnitude is
# its typical peak; Eta Carinae's is its 2018 brightness. The Coalsack has no magnitude.

[[showpiece]]
id = "pleiades"
name = "The Pleiades"
kind = "cluster"
ra = 56.601
dec = 24.114
mag = 1.6
size = 120.0
fact = "About 444 light years away; its stars are only around 125 million years old."
more = ["The Nebra sky disc, made in what is now Germany around 1600 BC, shows the Pleiades between the Sun and the Moon.", "Their name probably comes from the Greek for 'to sail': their rising marked the start of the Mediterranean sailing season."]

[[showpiece]]
id = "hyades"
name = "The Hyades"
kind = "cluster"
ra = 67.447
dec = 16.948
mag = 0.5
size = 330.0
fact = "The nearest open cluster to the Sun, about 153 light years away and some 625 million years old."
more = ["Orange Aldebaran sits among them but is unrelated, less than half as far away.", "They share their age, make-up and motion with the Beehive Cluster, and probably their birthplace too."]

[[showpiece]]
id = "andromeda"
name = "Andromeda Galaxy (M31)"
kind = "galaxy"
ra = 10.685
dec = 41.269
mag = 3.44
size = 190.0
fact = "A galaxy of around a trillion stars; the light you see left it about 2.5 million years ago."
more = ["Al-Sufi described it as a 'small cloud' around the year 964, the earliest known record of another galaxy.", "About 152,000 light years across, it is the largest member of our Local Group of galaxies."]

[[showpiece]]
id = "triangulum"
name = "Triangulum Galaxy (M33)"
kind = "galaxy"
ra = 23.462
dec = 30.660
mag = 5.72
size = 70.8
fact = "A spiral of about 40 billion stars, roughly 2.9 million light years away; binoculars and a dark sky needed."
more = ["For those who can see it without help, it is the farthest permanent thing visible to the naked eye.", "Giovanni Battista Hodierna probably found it before 1654; Messier found it again in August 1764."]

[[showpiece]]
id = "bodes-galaxy"
name = "Bode's Galaxy (M81)"
kind = "galaxy"
ra = 148.888
dec = 69.065
mag = 6.94
size = 26.9
fact = "A spiral galaxy about 12 million light years away, within reach of binoculars."
more = ["Johann Elert Bode discovered it on 31 December 1774, which is how it got its name.", "Its supernova of 1993 was, at the time, the second-brightest of its kind seen in the 20th century."]

[[showpiece]]
id = "orion-nebula"
name = "Orion Nebula (M42)"
kind = "nebula"
ra = 83.820
dec = -5.388
mag = 4.0
size = 65.0
fact = "About 1,270 light years away and 25 light years across: the closest region of massive star formation to Earth."
more = ["At its heart is the Trapezium, four bright young stars that a small telescope shows.", "Astronomers have seen planet-forming discs and brown dwarfs inside it."]

[[showpiece]]
id = "beehive"

size = 95.0
fact = "Around 1,000 stars roughly 600 light years away, known since ancient times as Praesepe."
more = ["Galileo turned his telescope on it in 1609 and counted 40 stars.", "The ancient Greeks saw a manger, with two neighbouring stars as donkeys feeding from it."]

[[showpiece]]

# Tonight's stories: a few lines each, myth and science, told while the view
# moves round the stars involved. A story is offered only when its `anchor`
# star (HR number) is well up. Each line may point at a star (`hr`) or a
# showpiece (`showpiece`) by id. `mirror` is the thought it leaves you with,
# turned from the sky back to the everyday. `figure` gives the lines to draw
# when the story's shape isn't simply its anchor's constellation, and
# `pattern = false` draws none.

[[story]]
id = "hunter-scorpion"
title = "The hunter and the scorpion"
anchor = 2061
mirror = "Orion and the Scorpion are hardly ever up at the same time. Some things are worth keeping apart like that: the day's work and the evening's rest."
lines = [
  { hr = 2061, say = "In one Greek telling, Orion was a great hunter who boasted he could kill any animal on Earth." },
  { say = "So the Earth sent a scorpion to stop him, and the gods set them both among the stars, far apart." },
  { say = "They sit on opposite sides of the sky: as Orion sets in the west, the Scorpion rises in the east, so they're hardly ever up together." },
  { hr = 2061, say = "Betelgeuse, his shoulder, is a red supergiant. Put it where the Sun is and it would reach out past the orbit of Mars." },
]

[[story]]
id = "perseus-andromeda"
title = "Perseus and the chained princess"
anchor = 15
mirror = "Andromeda didn't have to free herself; someone came. Most of us have someone who would come, if we asked."
lines = [
  { hr = 168, say = "Queen Cassiopeia boasted that she, or in some tellings her daughter Andromeda, was more beautiful than the nymphs of the sea." },
  { hr = 15, say = "In revenge the sea god sent a monster, and Andromeda was chained to a rock at the shore as its offering." },
  { hr = 1017, say = "Perseus, flying home with the head of Medusa, saw her and killed the monster; in one telling he turned it to stone with Medusa's head." },
  { hr = 936, say = "Algol marks Medusa's head. Its name comes from the Arabic for the demon's head, and every few days it really does dim, as a fainter star passes in front of it." },
]

[[story]]
id = "great-bear"
title = "The Great Bear"
anchor = 4301
mirror = "From Britain and much of the north, the Plough and the Little Bear circle the pole all year and never set. Some people are like that too: there in every season, whether or not we look up."
lines = [
  { hr = 4301, say = "Zeus loved the nymph Callisto, and in Ovid's telling a jealous Hera turned her into a bear; others blame Artemis, or Zeus himself." },
  { hr = 5340, say = "Years later her son Arcas nearly hunted her, so Zeus lifted them both into the sky: she became the Great Bear, and Arcas the Bear-keeper, Boötes, who follows her round the pole." },
  { hr = 5191, say = "Hera asked the sea gods never to let the Bear bathe, and in Homer's day, seen from Greece, its seven bright stars never sank below the horizon." },
]

[[story]]
id = "many-ploughs"
title = "One shape, many names"
anchor = 4905
# The Plough alone: the seven stars the story is about.
figure = [[4301, 4295], [4295, 4554], [4554, 4660], [4660, 4301], [4660, 4905], [4905, 5054], [5054, 5191]]
mirror = "The same seven stars, and every people who looked up saw something of their own in them. What a day looks like depends a lot on what we look for in it."
lines = [
  { hr = 4295, say = "In Britain these seven stars are the Plough; in North America they're the Big Dipper." },
  { hr = 4905, say = "In much of Europe they were a wagon, and in India they are the Saptarishi, seven wise men." },
  { hr = 5054, say = "The middle star of the handle, Mizar, has a faint companion, Alcor. Seeing both was once said to be a test of good eyesight." },
]

[[story]]
id = "weaver-cowherd"
title = "The weaver and the cowherd"
anchor = 7001
# The Summer Triangle: Vega, Altair and Deneb.
figure = [[7001, 7557], [7557, 7924], [7924, 7001]]
mirror = "The weaver and the cowherd get one night a year together, and they make it count. Is there someone you only see now and then, who'd be glad to hear from you?"
lines = [
  { hr = 7001, say = "In a story told across China, Korea and Japan, Vega is a weaver girl who fell in love with a cowherd, Altair." },
  { hr = 7557, say = "The Queen Mother of the West, a goddess, drew a river between them: the Milky Way." },
  { hr = 7924, say = "Once a year, on the seventh night of the seventh month, magpies make a bridge so they can meet. Some say Deneb is the bridge." },
]

[[story]]
id = "orpheus-lyre"
title = "Orpheus's lyre"
anchor = 7001
mirror = "Orpheus lost Eurydice by turning round to check she was there. Some things can be trusted without looking back; tonight, the day can stay behind you."
lines = [
  { hr = 7001, say = "Lyra is the lyre of Orpheus, whose music could charm animals, trees and even stones." },
  { say = "He played his way into the underworld to bring back his wife, Eurydice, and lost her by looking back too soon." },
  { hr = 7001, say = "Vega, the lyre's brightest star, was one of the first stars ever photographed, in 1850." },
]

[[story]]
id = "swan"
title = "The swan on the Milky Way"
anchor = 7924
mirror = "A swan looks calm because the paddling is out of sight. If today took a lot of paddling, you can stop now."
lines = [
  { hr = 7924, say = "Cygnus is a swan flying down the Milky Way, with Deneb at its tail." },
  { hr = 7417, say = "Its long neck stretches out to Albireo, the swan's beak, which close up turns out to be a gold star and a blue one." },
  { hr = 7924, say = "Deneb is among the most luminous stars the eye can see: tens of thousands of times brighter than the Sun." },
]

[[story]]
id = "twins"
title = "The twins who shared everything"
anchor = 2990
mirror = "Pollux gave up half of forever rather than be without his brother. Most of us have someone who shares their days with us like that, quietly."
lines = [
  { hr = 2891, say = "Castor and Pollux were twin brothers. Castor was mortal; Pollux, a son of Zeus, was not." },
  { hr = 2990, say = "When Castor was killed, Pollux asked to share his immortality with him." },
  { say = "In Pindar's telling they now take turns together, a day among the gods and a day in the underworld; in Homer's, they live on alternate days. Sailors once prayed to them for calm seas." },
]

[[story]]
id = "nemean-lion"
title = "The lion Heracles faced first"
anchor = 3982
mirror = "Even Heracles had his labours one at a time, not twelve at once. Tomorrow's can wait for tomorrow."
lines = [
  { hr = 3982, say = "Leo is usually said to be the lion of Nemea, whose skin no weapon could pierce. Killing it was the first of Heracles's twelve labours." },
  { hr = 4057, say = "Its head and mane are the Sickle, a backwards question mark of stars." },
  { hr = 3982, say = "Regulus, at the bottom of the Sickle, means little king." },
]

[[story]]
id = "seven-sisters"
title = "The Seven Sisters"
anchor = 1165
pattern = false
mirror = "Most people see six of the Seven Sisters; the seventh only shows once your eyes have settled. Some good things are like that: they need you to slow down first."
lines = [
  { showpiece = "pleiades", say = "Almost every people on Earth has a story for the Pleiades. To the Greeks they were seven sisters, daughters of Atlas." },
  { showpiece = "pleiades", say = "In Japan they are Subaru, and six of them shine on the car maker's badge." },
  { showpiece = "pleiades", say = "In Aotearoa New Zealand they are Matariki, whose rising marks the Māori new year for many iwi. Most people can see six; the seventh takes a dark sky." },
]

[[story]]
id = "bull-europa"
title = "The white bull"
anchor = 1457
mirror = "Pioneer 10 carries a message for whoever finds it, from people who knew they'd never hear back. A lot of kindness works that way: sent off, never counted."
lines = [
  { hr = 1457, say = "Taurus is usually said to be the beautiful white bull Zeus became to carry the princess Europa across the sea to Crete." },
  { hr = 1457, say = "Aldebaran, the bull's eye, means the follower in Arabic: it rises after the Pleiades as if chasing them." },
  { hr = 1457, say = "The Pioneer 10 spacecraft is drifting in its direction, and will pass it in about two million years." },
]

[[story]]
id = "dog-star"
title = "The Dog Star"
anchor = 2491
mirror = "The Egyptians watched for Sirius because it meant good things were coming. It helps to have something of your own to watch for."
lines = [
  { hr = 2491, say = "In ancient Egypt, the first sight of Sirius rising just before dawn told people the Nile's yearly flood was coming." },
  { hr = 2491, say = "The Greeks and Romans blamed it for the heat of late summer, when it rose with the Sun: the dog days." },
  { hr = 2491, say = "It's the brightest star in the night sky, and it has a tiny companion, a white dwarf the size of the Earth." },
]

[[story]]
id = "arcturus-fair"
title = "The star that opened a fair"
anchor = 5340
mirror = "Light thought to have left Arcturus in 1893 opened a fair in 1933. A lot of what holds us up today was lit by someone, years ago."
lines = [
  { hr = 5340, say = "Arcturus means guardian of the bear: it follows the Great Bear round the pole." },
  { hr = 5340, say = "In 1933 its light, focused onto a photocell, switched on the lights of the Chicago World's Fair." },
  { hr = 5340, say = "It was chosen because its light was thought to have set out around the time of the city's last fair, in 1893." },
]

[[story]]
id = "turning-pole"
title = "The pole star that won't stay"
anchor = 424
mirror = "Even the pole star changes, over thousands of years. What we steer by can change too; it's worth asking now and then what yours is."
lines = [
  { hr = 424, say = "Polaris sits almost exactly above the Earth's north pole, so the whole northern sky seems to turn round it." },
  { hr = 5291, say = "But the Earth wobbles slowly, like a spinning top. When the pyramids were built, the pole star was Thuban, in the Dragon." },
  { hr = 7001, say = "In about twelve thousand years it will be bright Vega's turn." },
]

[[story]]
id = "southern-cross"
title = "The Southern Cross"
anchor = 4730
mirror = "Sailors didn't need to see the pole itself, only something they knew to find it from. On a lost sort of day, start from what you're sure of."
lines = [
  { hr = 4730, say = "The Southern Cross is on the flags of Australia, New Zealand, Brazil, Samoa and Papua New Guinea." },
  { hr = 4763, say = "Follow its long arm about four and a half times its length and you reach the south celestial pole, which is how sailors found south." },
  { showpiece = "coalsack", say = "Beside it is the Coalsack, a dark cloud. In many Aboriginal Australian traditions it is the head of the Emu in the Sky, whose body is the dark lanes of the Milky Way." },
]

[[story]]
id = "magellanic"
title = "Two small galaxies"
anchor = 472
pattern = false
mirror = "The Magellanic Clouds, two small galaxies, keep ours company the whole way round. Company makes a long road shorter."
lines = [
  { showpiece = "lmc", say = "The Magellanic Clouds are named after Magellan's voyage of 1519, but people of the southern hemisphere knew them long before, and the Persian astronomer al-Sufi wrote of the larger one in 964." },
  { showpiece = "lmc", say = "They are small galaxies circling our own." },
  { showpiece = "lmc", say = "In 1987 a star exploded in the Large Cloud: the closest supernova anyone had seen since 1604." },
]

[[story]]
id = "andromeda-galaxy"
title = "The little cloud"
anchor = 337
mirror = "One measurement of the Andromeda Galaxy, and the universe was far bigger than anyone had thought. Most worries look smaller once you see how big everything else is."
lines = [
  { showpiece = "andromeda", say = "In 964 al-Sufi described a small cloud in Andromeda." },
  { showpiece = "andromeda", say = "In the 1920s Edwin Hubble measured its distance and showed it was a whole galaxy of its own, far beyond ours: the universe suddenly got much bigger." },
  { showpiece = "andromeda", say = "It's heading our way, and billions of years from now it may merge with the Milky Way." },
]

[[story]]
id = "hercules"
title = "Hercules and the dragon"
anchor = 6212
mirror = "The Arecibo message will take 25,000 years to reach M13. Some things are worth doing even if we never see where they end up."
lines = [
  { hr = 6406, say = "Hercules hangs upside down in our sky, kneeling, a foot near the Dragon's head. His head is this star, Rasalgethi, just beyond the lines drawn for him." },
  { showpiece = "m13", say = "In his side is M13, the Great Hercules Cluster: several hundred thousand stars in a ball." },
  { showpiece = "m13", say = "In 1974 the Arecibo radio telescope beamed a message towards it. It will take about 25,000 years to arrive." },
]

[[story]]
id = "eagle"
title = "Zeus's eagle"
anchor = 7557
mirror = "Altair spins that fast and still holds together. Busy days do too, and this part of the day is for slowing down."
lines = [
  { hr = 7557, say = "Aquila is usually Zeus's own eagle, which carried his thunderbolts, and carried the shepherd boy Ganymede up to Olympus." },
  { hr = 7557, say = "Altair spins so fast, once in under eight hours, that it bulges at its middle." },
]

[[story]]
id = "maui-hook"
title = "Maui's fish-hook"
anchor = 6134
mirror = "Maui pulled up whole islands with one hook. Big things mostly start as one small plan."
lines = [
  { hr = 6134, say = "To many Polynesian peoples, the Scorpion's curve is the fish-hook of Maui, who used it to pull islands up from the sea." },
  { hr = 6134, say = "Antares, at its heart, is a red supergiant hundreds of times wider than the Sun." },
]

[[story]]
id = "goat-star"
title = "The little she-goat"
anchor = 1708
mirror = "Capella's one point of light turns out to be four stars keeping each other company. Most of us are held up by more than we can see."
lines = [
  { hr = 1708, say = "Capella means little she-goat. In Greek myth it's the goat who fed the infant Zeus, most often called Amalthea." },
  { hr = 1708, say = "It looks like one yellow star, but it's two giant stars close together, with a pair of small dim ones further out." },
]

[[story]]
id = "milky-way"
title = "Why it's called the Milky Way"
anchor = 7796
pattern = false
mirror = "Too many suns to count, and today was one day under them. It's good to look at something that big now and then; it puts the day in its place."
lines = [
  { hr = 7796, say = "In most Greek tellings the Milky Way is milk spilt across the sky by the goddess Hera as she nursed a baby, Heracles or Hermes; our word galaxy comes from the Greek for milk." },
  { hr = 7796, say = "It's really our own galaxy seen from inside: the light of more stars than you could ever count, too far off to see one by one." },
]

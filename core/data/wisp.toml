# How the wisp looks: warm white-gold, clear, with a soft steady glow,
# taken a little of the way toward a brighter, cooler white so the core
# never reads as yellow. The two blend in OKLab.
#
#   core, glow  the bright centre and the halo around it
#   brightness  0-1, the glow's strength
#   toward      how far the warm look is taken toward the cool one, 0-1

toward = 0.142857142857

[warm]
core = "#fff6dc"
glow = "#f2c063"
brightness = 1.0

[cool]
core = "#fffaf0"
glow = "#e6d39c"
brightness = 0.95

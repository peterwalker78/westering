# Proper names of bright stars, keyed by Yale Bright Star Catalogue (HR) number.
# HR numbers from SIMBAD identifiers, cross-checked against the IAU Catalog of Star
# Names. light_years uses SIMBAD parallaxes (distance = 3261.56 / parallax in mas); the
# app works out when the light left from it. Facts for Betelgeuse, Rigel, Deneb, Acrux
# and Navi come from their Wikipedia pages. Stars with poorly known distances get none.


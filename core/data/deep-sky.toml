# Messier objects not already in showpieces.toml, and some of the brightest and best-known
# NGC and IC objects of both hemispheres. Same format as showpieces.toml. Positions (J2000)
# from SIMBAD: the Veil uses its entry for the Cygnus Loop, the Rosette Nebula its entry for
# the whole nebula, and M102 NGC 5866. Magnitudes and sizes from Wikipedia, the infobox or
# else the article text (NGC 6543's infobox gives only a blue magnitude); SIMBAD's size where
# Wikipedia has none (M54, IC 4756). M40 is a double: its magnitude is the brighter star's and
# its size the separation. Facts checked against each object's Wikipedia page.

[[showpiece]]
id = "m1"
name = "Crab Nebula (M1)"
kind = "nebula"
ra = 83.632
dec = 22.017
mag = 8.4
size = 7.0
fact = "The wreck of a star whose explosion Chinese and Japanese astronomers recorded in 1054; it lies about 6,500 light years away."
more = ["At its heart spins a neutron star about 30 kilometres across, turning some 30 times a second.", "Charles Messier came across it in 1758 while hunting a comet, and made it the first entry in his catalogue."]

[[showpiece]]
id = "m2"
name = "M2"
kind = "cluster"
ra = 323.363
dec = -0.823
mag = 6.5
size = 16.0
fact = "About 37,500 light years away and 175 light years across, one of the larger globular clusters known."
more = ["Around 150,000 stars, some 12.5 billion years old.", "Messier took it for a starless nebula; William Herschel was the first to see its stars, in 1783."]

[[showpiece]]
id = "m9"
name = "M9"
kind = "cluster"
ra = 259.799
dec = -18.516
mag = 7.7
size = 9.3
fact = "About 25,800 light years away, and one of the nearer globular clusters to the centre of the galaxy."
more = ["It lies against a dark cloud of dust called Barnard 64.", "Together its stars shine around 120,000 times as brightly as the Sun."]

[[showpiece]]
id = "m10"
name = "M10"
kind = "cluster"
ra = 254.288
dec = -4.100
mag = 6.6
size = 20.0
fact = "About 14,300 light years away; its bright core is only 35 light years across."
more = ["It goes round the Milky Way about every 140 million years, crossing the galaxy's disc every 53 million.", "Messier saw only a 'nebula without stars'; William Herschel later called it a beautiful cluster of extremely compressed stars."]

[[showpiece]]
id = "m12"
name = "M12"
kind = "cluster"
ra = 251.809
dec = -1.949
mag = 6.7
size = 16.0
fact = "About 16,400 light years away, and so loosely packed that it was once taken for an open cluster."
more = ["It has unusually few low-mass stars, perhaps stripped away as it passed through the Milky Way's disc.", "Only a few thousand light years separate it from M10; seen from one, the other would shine at about magnitude 4.5."]

[[showpiece]]
id = "m14"
name = "M14"
kind = "cluster"
ra = 264.401
dec = -3.246
mag = 7.6
size = 11.0
fact = "About 30,000 light years away and home to several hundred thousand stars."
more = ["A nova flared here in 1938, but nobody noticed until old photographic plates were studied in 1964.", "Its stars together shine roughly 400,000 times as brightly as the Sun."]

[[showpiece]]
id = "m15"
name = "M15"
kind = "cluster"
ra = 322.493
dec = 12.167
mag = 6.2
size = 18.0
fact = "About 35,700 light years away and roughly 12.5 billion years old, one of the oldest globular clusters known."
more = ["One of the most densely packed globulars in the galaxy: its core has collapsed in on itself.", "It holds Pease 1, found in 1928, the first planetary nebula discovered inside a globular cluster."]

[[showpiece]]
id = "m16"
name = "Eagle Nebula (M16)"
kind = "nebula"
ra = 274.688
dec = -13.792
mag = 6.4
size = 70.0
fact = "Home of the Pillars of Creation, the towers of gas and dust made famous by the Hubble Space Telescope in 1995."
more = ["About 5,700 light years away; its cluster's stars are only 1 to 2 million years old.", "Its brightest star is a binary of roughly 80 solar masses, up to a million times as luminous as the Sun."]

[[showpiece]]
id = "m17"
name = "Omega Nebula (M17)"
kind = "nebula"
ra = 275.196
dec = -16.172
mag = 6.0
size = 11.0
fact = "Also called the Swan Nebula; it lies 5,000 to 6,000 light years away and is one of the brightest star-forming regions in the galaxy."
more = ["The cluster inside it is one of the youngest known, only about a million years old.", "John Herschel, drawing it in 1833, likened it to a distorted Greek capital omega."]

[[showpiece]]
id = "m18"
name = "M18"
kind = "cluster"
ra = 274.988
dec = -17.088
mag = 7.5
size = 9.8
fact = "A sparse open cluster about 4,200 light years away, whose stars are some 33 million years old."
more = ["It takes about 186 million years to travel once around the centre of the Milky Way.", "It sits in the Milky Way between the Omega Nebula and the Small Sagittarius Star Cloud."]

[[showpiece]]
id = "m19"
name = "M19"
kind = "cluster"
ra = 255.657
dec = -26.268
mag = 6.8
size = 17.0
fact = "About 28,700 light years away, and only about 6,500 light years from the centre of the galaxy."
more = ["One of the most flattened-looking globulars, though mostly because dust dims one edge; in infrared it looks almost round.", "John Herschel called it 'a superb cluster resolvable into countless stars'."]

[[showpiece]]
id = "m20"
name = "Trifid Nebula (M20)"
kind = "nebula"
ra = 270.675
dec = -22.972
mag = 6.3
size = 28.0
fact = "Its name means 'three-lobed': dark lanes of dust split its glowing gas into three."
more = ["Four things in one: a star cluster, a red emission nebula, a blue reflection nebula and dark dust.", "About 4,100 light years away; in 2005 the Spitzer telescope found 30 embryonic and 120 newborn stars hidden inside."]

[[showpiece]]
id = "m21"
name = "M21"
kind = "cluster"
ra = 271.036
dec = -22.505
mag = 6.5
size = 14.0
fact = "A young, tightly packed cluster about 3,900 light years away, its stars only around 6.6 million years old."
more = ["It sits beside the Trifid Nebula in the sky but has nothing to do with it.", "Its stars show little spread in age, as if they all formed at once."]

[[showpiece]]
id = "m23"
name = "M23"
kind = "cluster"
ra = 269.237
dec = -18.987
mag = 5.5
size = 35.0
fact = "About 2,050 light years away; its stars are around 330 million years old."
more = ["It lies so near the Sun's yearly path that the Moon can pass in front of it.", "Counts of its member stars range from about 170 to more than 400."]

[[showpiece]]
id = "m24"
name = "Small Sagittarius Star Cloud (M24)"
kind = "cloud"
ra = 274.200
dec = -18.550
mag = 2.5
size = 120.0
fact = "Not an object of its own: a gap in the nearby dust lets us see deep into one of our galaxy's inner spiral arms, where stars lie 10,000 to 16,000 light years away."
more = ["Binoculars show around 1,000 stars at once here, the densest crowd of stars they can reach.", "A dark cloud, Barnard 92, makes a round, starless hole in its north-western side."]

[[showpiece]]
id = "m25"
name = "M25"
kind = "cluster"
ra = 277.937
dec = -19.114
mag = 4.6
size = 36.0
fact = "About 2,000 light years away and some 68 million years old."

# What the wisp says: the first evening's lessons, its hellos, and the ways
# it marks time. Time here is kept the way the sky keeps it (Moons, seasons,
# the year coming round), never by counting visits, and nothing here may
# mind how long anyone was away.
#
# greeting.when: all must hold for the line to be chosen. Any of
#   full-moon new-moon crescent   the Moon tonight
#   late early                    after ten at night / before eight
#   monday friday saturday sunday
#   winter spring summer autumn   by the month, for the user's hemisphere
# A greeting with a `when` is preferred over one without, some nights.

[[greeting]]
text = "Hello again."

[[greeting]]
text = "Good to see you."

[[greeting]]
text = "Clear skies in here, at least."

[[greeting]]
text = "Let's set the day down for a while."

[[greeting]]
text = "A few quiet minutes, and then the rest of the night is yours."

[[greeting]]
text = "Hello. Same sky as outside, give or take the clouds."

[[greeting]]
when = ["full-moon"]
text = "Hello. The Moon's full tonight: it washes the faint stars out, but it's worth a look itself."

[[greeting]]
when = ["new-moon"]
text = "Hello. No Moon tonight, so the sky is as dark as it gets all month."

[[greeting]]
when = ["crescent"]
text = "Hello. There's a thin Moon tonight, the prettiest shape it makes."

[[greeting]]
when = ["late"]
text = "Hello. It's late, so let's keep this gentle and short."

[[greeting]]
when = ["early"]
text = "Hello. Early for the stars, but the sky's getting ready."

[[greeting]]
when = ["friday"]
text = "Hello. The end of the week: put it down here for a while."

[[greeting]]
when = ["sunday"]
text = "Hello. One more quiet evening before the week begins."

[[greeting]]
when = ["monday"]
text = "Hello. The first day of the week is done."

[[greeting]]
when = ["winter"]
text = "Hello. Long nights this time of year, and plenty of sky in them."

[[greeting]]
when = ["spring"]
text = "Hello. The evenings are getting lighter, a little more each night."

[[greeting]]
when = ["summer"]
text = "Hello. Short nights this time of year: the sky is only truly dark for a few hours."

[[greeting]]
when = ["autumn"]
text = "Hello. The nights are drawing in, so there's more sky each evening."

# When the sky has come all the way round since the first evening: the same
# stars in the same places at the same hour. Said once a year.
[round]
text = "The sky has come all the way round: tonight it's back where it was on {date}, your first evening here."
person = "That was the night you first named {name}."
find = "That night you found {find}."

# What the sky did since the last visit, when it's been a while. It says
# what changed up there, not how long anyone was gone.
[news]
risen = "Since you were last here, {name} has come up into the evening sky."
moon = "The Moon has been all the way round since you were last here."
# As the sky darkens after sunset, more comes out.
darker-one = "It's getting darker, and something else is out now: it's on the list."
darker-many = "It's getting darker, and more is coming out: {n} more things on the list."

# The Sun passing an equinox or a solstice in the last few days, named for
# the user's own hemisphere.
[turn]
spring = "The spring equinox was {day}: from now until autumn, the days are longer than the nights."
longest-day = "The longest day was {day}. From here the nights grow again, and the stars get a little more time."
autumn = "The autumn equinox was {day}: from now until spring, the nights are longer than the days."
longest-night = "The longest night was {day}. From here the days lengthen again, slowly at first."

# A person's star, when it's up. Not every night: now and then.
[star]
text = "{name}'s star, {star}, is up tonight, {where}."

# Keeping someone company in the background, with the music on. The wisp
# looks in every half hour or so; what it says leans towards looking after
# yourself, and towards bed as it gets late. It always ends: after two
# hours, or once it's well past midnight, it winds the evening down.
[company]
start = "I'll keep you company. The music plays on, and I'll look in on you now and then. K, or a click on me, brings the sky back."
back = "There's the sky again."
not-yet = "Once this is done, K lets me keep you company in the background."
care = [
  "Still here. Let your shoulders drop, and your jaw.",
  "A sip of water, if there's some nearby.",
  "Look at something far away for a moment: eyes like a change of distance.",
  "If you've been sitting a while, stand up and stretch. I'll wait.",
  "Breathe out slowly, a little longer than the breath in. Once more.",
  "Unclench your hands for a moment. There.",
  "Warm enough? Small comforts count for a lot.",
]
care-day = [
  "If there's a window near you, look out of it for a moment: the real sky's right there.",
  "Had something to eat lately? A proper break counts for more than it looks.",
  "Stretch your legs for a minute, if you can. I'll be right here.",
  "If it's a fine day, a window open for a while lets the day in.",
]
care-night = [
  "Is the light where you are soft enough? Gentler light makes for an easier night.",
  "A warm drink, if you fancy one: something without caffeine, this late.",
  "The screen can come down a notch or two now. Your eyes will be ready for sleep sooner.",
]
people = [
  "{name} might like to hear from you some time. No rush.",
  "Is there someone you've been meaning to send a few words to? Tonight's as good a night as any.",
]
risen = "{name} has come up since you put me on, {where}."
late = "It's getting late. Whenever you're ready, W winds down and I'll see you off to bed."
closing = "That's been a good long while. I'll wind down now, and the music with me."

# On the night of a plan, a warm mark sits on the horizon. These say, beside
# it, what the mark is for: where to look, or where and when to look later.
[plan]
up = "{name} is above this mark."
rises = "{name} rises at this mark about {time}."
shower_up = "The {name} seem to come from above this mark."
shower_later = "The {name} seem to come from above this mark, after about {time}."

# A quarter of an hour or so in, once: the way out, offered at the foot of
# the screen. It says what winding down is, and never how long it's been.
[evening]
offer = "Ready to stop? Press W, or Wind down at the top left, for a few slow breaths and then lights out"

# Free look, where the wisp keeps quiet. When the list is done it hands
# the sky over with one line; F before the first find gets one at the foot.
[free]
handover = "That's tonight's list. Now the sky's yours: anything that glows has more to tell."
wait = "Find one thing first, then F lets you look around on your own"

# By day, looking down at the ground instead of up at the stars.
[day]
first = [
  "Hello. I'm the wisp. The stars are out of sight while the Sun is up, so by day we look down instead.",
  "Everything here is true where you are today: where the Sun is, how long your shadow falls, and a few small things on the ground this time of year.",
]
hello = [
  "Hello. No stars yet, so let's look down for a change.",
  "Hello. A few minutes with the ground under your feet, then back to your day.",
  "Hello. The sky's busy being blue, so let's see what's down here.",
  "Hello. A short look at today, then off you go.",
]
list = "Today's finds are listed here. Click one, or tap Space, and I'll show you the next."
done = "That's today, all of it. W takes you back to your day whenever you're ready."
ending = "Go well."
outside = "If you can, step outside for five minutes: the Sun is {where}, and your shadow is {length}, pointing {toward}."
dusk = "If you can, step outside for five minutes before the light goes: it'll be dark by about {time}."

# The wisp as a guide: on the first evening it shows the way and says what
# each part is for, each thing once. A few lines come back on any evening:
# the count on arriving, the way the evening ends, a nudge if someone's lost.
[teach]
hello = "Hello. I'm the wisp. This is the real sky over you tonight, just as it is outside."
why = "Come here for a few quiet minutes at the end of the day: to put the day down, come back to what matters to you, and get ready for sleep. The sky is never the same two nights running, so there's always something new to find."
parts = "Every evening has the same four parts, shown up here: set down what's on your mind, explore tonight's list, look up on your own, then wind down."
# After the hello on later evenings.
one-thing = "One thing to find tonight."
things = "{n} things to find tonight."
found-already = "You've found tonight's sky already; look around as long as you like."
still-light = "It's still light out, so there's not much to find yet."
late = "It's late, so tonight's sky is a short one. W winds down whenever you're ready."
weights = "Each evening starts here. A worry written down is easier to put down. Yours becomes a star in the west of this sky, and you'll watch it set at the end. Only you will ever see it."
placing = "Stars low in the west are the next to set. At the end of tonight's visit, you'll watch this one go down."
list-one = "One thing to find tonight, listed here with where to look."
list = "{n} things to find tonight, listed here in order round the sky. Click one and I'll turn you to it."
compass = "This strip shows which way you're facing. The arrows, or a drag, turn you round."
point = "Point at anything in the sky to see what it is, and click it to hear more."
ring = "There's one in the ring. Hold Space, or press and hold on the ring, to catch it."
card = "Every find comes with a card. Space or a click puts it away, then I'll turn you to the next."
draw = "You can join bright stars into a shape of your own, too: press C."
drawing = "Arrows step between bright stars, Enter joins them, Backspace takes one back. Press C when it's done."
meteor = "The last one is a meteor. Keep watching, and press Space the moment one flies."
lost = "Lost? Pick one from the list, or tap Space, and I'll turn you to the next."
question = "Now and then the sky asks something small. There's no right answer, and only you will ever see what you write. Esc lets it pass."
plans = "Something to look forward to is worth having. If you make a plan, I'll mention it when its night comes near."
names = "Just a first name will do. Only you will ever see it."
logbook = "It's kept in your logbook, which L opens. Anything that keeps coming up gathers on a page of its own, so over time you can see what matters."
look-back = "Now and then I'll bring back a worry you set down a while ago. Worries often change shape once they're written down, and it helps to notice when one has."
# At the foot of the screen, once an old worry has been looked at again.
kept-behind = "Kept in your logbook. It won't be brought back again"
kept-beside = "Kept beside it in your logbook"
course = "If you'd like, the logbook can help you chart a small plan for it: find it there and choose Chart a course. Only if you want to."
outside = "Then I'll show you what's up out there. Give your eyes twenty minutes in the dark: they keep opening all that time."
bed = "Then this is the last of the screen tonight. Watch the day go down with the sky."
dimming = "Let's wind down. The screen dims a little at a time from here: bright light keeps a mind awake."
# As the sky turns at the end: the first worry set down tonight, by name.
setting-one = "Watch the west. The turning sky takes “{weight}” down with it."
setting = "Watch the west: the turning sky is taking down what you set down tonight."
turning = "Watch the sky turn."
goodnight = "Goodnight."

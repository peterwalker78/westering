id: io.github.peterwalker78.Westering
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: westering

# No network permission at all: nothing the user writes can leave the machine.
# Sound is only the music.
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Read once, to bring across a logbook kept when the app was called Night Sky.
  - --filesystem=~/.var/app/io.github.peterwalker78.NightSky/data/night-sky:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: westering
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/westering/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --offline -p westering
      - install -Dm755 target/release/westering /app/bin/westering
      - install -Dm644 data/io.github.peterwalker78.Westering.desktop -t /app/share/applications
      - install -Dm644 data/io.github.peterwalker78.Westering.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/io.github.peterwalker78.Westering.svg -t /app/share/icons/hicolor/scalable/apps
      - for pack in app/data/music/*/; do install -Dm644 "$pack"* -t "/app/share/westering/music/$(basename "$pack")"; done
      - if [ -f app/data/images/credits.toml ]; then install -Dm644 app/data/images/*.jpg app/data/images/credits.toml -t /app/share/westering/images; fi
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .tools
          - .flatpak-builder
          - .flatpak-repo
          - build
          - dist
          - target
          - tools/raw
      - cargo-sources.json

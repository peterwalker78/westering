name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core is the sky, the session and the logbook with no user interface.
  # This is what says so: it builds and runs its tests with no GTK in sight.
  core:
    name: the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked -p westering-core
      - run: cargo clippy --locked -p westering-core --all-targets -- -D warnings

  # The GTK build, on the toolchain it is developed against.
  app:
    name: the GTK app
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust clippy rustfmt gcc pkgconf-pkg-config \
            gtk4-devel glib2-devel git tar findutils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # There is no distrobox here, so this runs where it stands.
      - name: Check
        run: scripts/check

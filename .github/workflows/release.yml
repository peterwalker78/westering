name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: westering-x86_64.flatpak
          manifest-path: flatpak/io.github.peterwalker78.Westering.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: westering-linux
          path: westering-x86_64.flatpak

  # Run by hand, the workflow stops at the bundle above. Only a tag publishes.
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/')
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: westering-linux
          path: built
      - name: Checksum
        # Slipstream's installer fetches the .sha256 beside the bundle.
        run: |
          cd built
          sha256sum westering-x86_64.flatpak > westering-x86_64.flatpak.sha256
      - name: Attach to the release
        # A release that is already there keeps its notes and gets these files.
        # A new one stays a draft until the files are on it, so "latest" never
        # points at a release with nothing to download.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" built/* --clobber
          else
            gh release create "$TAG" --draft --title "Westering ${TAG#v}" --generate-notes
            gh release upload "$TAG" built/*
            gh release edit "$TAG" --draft=false
          fi

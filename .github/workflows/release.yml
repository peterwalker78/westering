name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the job that publishes can write to the repository.
permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: westering-x86_64.flatpak
          manifest-path: flatpak/io.github.peterwalker78.Westering.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: westering-linux
          path: westering-x86_64.flatpak

  # Run by hand, the workflow stops at the bundle above. Only a tag publishes.
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: westering-linux
          path: built
      - name: Checksum
        # Slipstream's installer fetches the .sha256 beside the bundle.
        run: |
          cd built
          sha256sum westering-x86_64.flatpak > westering-x86_64.flatpak.sha256
      - name: Sign
        # Slipstream checks the bundle against this signature and refuses an unsigned one,
        # so without the secret the release stops here.
        env:
          EXTRA_SIGNING_KEY: ${{ secrets.EXTRA_SIGNING_KEY }}
        run: |
          if [ -z "$EXTRA_SIGNING_KEY" ]; then
            echo "::error::EXTRA_SIGNING_KEY isn't set, and Slipstream refuses an unsigned bundle"
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$EXTRA_SIGNING_KEY" >"$key"
          ssh-keygen -q -Y sign -f "$key" -n slipstream-extra built/westering-x86_64.flatpak
      - name: Attach to the release
        # A release that is already there keeps its notes and gets these files.
        # A new one stays a draft until the files are on it, so "latest" never
        # points at a release with nothing to download.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" built/* --clobber
          else
            gh release create "$TAG" --draft --title "Westering ${TAG#v}" --generate-notes
            gh release upload "$TAG" built/*
            gh release edit "$TAG" --draft=false
          fi
